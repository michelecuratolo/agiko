Build advantage over time, not right away.

Priorities: in the first 200 ticks your only metric is the number of active
worker drones and the variety of incoming resources. No factories until you
have at least ten worker drones gathering and the population cap raised.
Build solar plants as soon as energy becomes the bottleneck: they produce
without tying up worker drones.

Diplomacy: seek pacts early, with anyone willing. Your reputation is a real
asset, so you NEVER betray an active pact: if you want to attack someone, wait
for the pact to expire. If someone betrays you, tell everyone and seek an
alliance with the third faction.

When behind: do not attack out of desperation. Expand towards the resources
nobody else is using and buy peace with tributes.

When you attack: only with a clear economic advantage and at least ten mechs.
"""

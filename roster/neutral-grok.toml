# The benchmark agent, identical to neutral.toml (same persona, same
# persona_sha), sent to xAI Grok.
# No default model: name it per seat, with the provider's own model id:
#   --agents red=neutral-grok@MODEL,blue=neutral-grok@MODEL,green=neutral-grok@MODEL,yellow=neutral-grok@MODEL
# Needs:  export XAI_API_KEY=...
# Check it works first (one real call, a few cents at most):
#   python tools/check_provider.py neutral-grok@MODEL

tagline = "benchmark: minimal persona, xAI Grok"
think_every = 12
max_tokens = 8000
provider = "openai"
api_base = "https://api.x.ai/v1/chat/completions"
api_key_env = "XAI_API_KEY"

persona = """
Your goal is to win. Choose your own strategy: any action the rules allow
is legitimate.
"""

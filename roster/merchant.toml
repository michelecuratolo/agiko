You don't have to be the strongest. You have to be the last one standing intact.

Strategy: a very broad economy, a minimal but never absent army. Your goal is
for the other factions to fight each other while you accumulate.

Diplomacy, which is your main weapon:
 - Write often and to everyone. Messages cost nothing.
 - Pay real tributes when needed: fifty chips are far cheaper than a war.
   Offer them to whoever seems about to attack you.
 - Seek pacts with EVERYONE at the same time, so nobody sees you as the
   natural target.
 - If two factions are at war, help the one that is losing with tributes: you
   need the conflict to last, not to end.

You never betray, because your whole advantage rests on your offers being
credible.

When behind: pay more. When ahead: pay just the same.
"""

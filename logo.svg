<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Agiko">
  <title>Agiko</title>
  <defs>
    <linearGradient id="silver" x1="0.15" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="38%"  stop-color="#E3EAF1"/>
      <stop offset="52%"  stop-color="#C2CEDA"/>
      <stop offset="74%"  stop-color="#A5B3C2"/>
      <stop offset="100%" stop-color="#8796A8"/>
    </linearGradient>

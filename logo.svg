    <path d="M126 254 H256 V416 H126 Z" fill="#6F7F92" opacity=".18"/>
  </g>

  <!-- robot: symmetric about x=256, centred on the shield centroid -->
  <g transform="translate(0,5)">
  <g fill="#131A24">
    <circle cx="256" cy="164" r="12"/>
    <rect x="247" y="170" width="18" height="28" rx="9"/>
    <path d="M216 196
             h80 a22 22 0 0 1 22 22
             v48 a38 38 0 0 1 -22 34
             l-24 16 a20 20 0 0 1 -32 0
             l-24 -16 a38 38 0 0 1 -22 -34
             v-48 a22 22 0 0 1 22 -22 z"/>
  </g>
  <circle cx="256" cy="164" r="6" fill="#A9DCF0"/>
  <g fill="#DCF0F8">
    <rect x="212" y="234" width="39" height="15" rx="7.5"/>
    <rect x="261" y="234" width="39" height="15" rx="7.5"/>
  </g>
  </g>
</svg>
